
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESS Campus QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      cursor: pointer;
    }
    #reader {
      width: 100%;
      margin-top: 16px;
    }
    #status {
      background: #f1f1f1;
      padding: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>ESS Campus QR Scanner</h2>
  <p>Scan a Pass Slip QR code to read its contents.</p>
  <p id="status" role="status">Ready to scan.</p>

  <button id="start" type="button">Start QR Scanner</button>
  <button id="stop" type="button" disabled>Stop Scanner</button>

  <div id="reader"></div>

  <h3>Scanned QR content</h3>
  <pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>

  
<script>
  "use strict";

  const status = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const startButton = document.getElementById("start");
  const stopButton = document.getElementById("stop");
  const reader = document.getElementById("reader");
  const environment = document.getElementById("environment");

  let scanner = null;
  let starting = false;
  let lastText = "";

  if (environment) {
    environment.textContent =
      "Secure context: " + window.isSecureContext +
      " | Camera API: " +
      Boolean(navigator.mediaDevices?.getUserMedia);
  }

  function showStatus(message) {
    if (status) status.textContent = message;
  }

  async function startCamera() {
    if (starting || scanner) return;

    if (!window.isSecureContext) {
      showStatus("Please open the scanner using HTTPS.");
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      showStatus("Camera API unavailable. Open this page in Chrome using HTTPS.");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      showStatus("Scanner library not loaded. Check the Html5Qrcode script.");
      return;
    }

    starting = true;
    startButton.disabled = true;
    showStatus("Requesting camera permission...");

    const instance = new Html5Qrcode("reader");
    scanner = instance;

    try {
      await instance.start(
        { facingMode: "user" },
        {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        },
        function (decodedText) {
  if (decodedText === lastText) return;

  lastText = decodedText;

  if (resultEl) {
    resultEl.textContent = decodedText;
  }

  showStatus("QR code read successfully.");

  // Send the scanned QR text to the ESS Dashboard.
  if (window.parent !== window) {
    window.parent.postMessage(
      {
        type: "ESS_QR_SCANNED",
        text: decodedText
      },
      "*"
    );
  }
},
        function () {
          // Ignore frames without a detected QR code.
        }
      );

      stopButton.disabled = false;
      showStatus("Camera running. Point it at a QR code.");
    } catch (error) {
      try {
        await instance.clear();
      } catch (_) {
        // Ignore cleanup errors.
      }

      if (scanner === instance) scanner = null;

      startButton.disabled = false;
      stopButton.disabled = true;

      if (error.name === "NotAllowedError") {
        showStatus(
          "Camera permission denied. Allow camera access in Chrome settings and retry."
        );
      } else {
        showStatus(
          "Could not start scanner: " +
          (error.message || String(error))
        );
      }

      console.error("ESS camera start error:", error);
    } finally {
      starting = false;
    }
  }

  async function stopCamera() {
    if (starting || !scanner) return;

    const instance = scanner;
    scanner = null;
    stopButton.disabled = true;
    showStatus("Stopping camera...");

    try {
      await instance.stop();
    } catch (error) {
      console.warn("Scanner stop warning:", error);
    }

    try {
      await instance.clear();
    } catch (error) {
      console.warn("Scanner cleanup warning:", error);
    }

    startButton.disabled = false;
    showStatus("Camera stopped.");
  }

  startButton.addEventListener("click", startCamera);
  stopButton.addEventListener("click", stopCamera);

  window.addEventListener("pagehide", function () {
    if (scanner) {
      scanner.stop().catch(function () {});
    }
  });
</script>
</body>
</html>

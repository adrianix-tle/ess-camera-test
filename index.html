
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESS Campus QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      cursor: pointer;
    }
    #reader {
      width: 100%;
      margin-top: 16px;
    }
    #status {
      background: #f1f1f1;
      padding: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>ESS Campus QR Scanner</h2>
  <p>Scan a Pass Slip QR code to read its contents.</p>
  <p id="status" role="status">Ready to scan.</p>

  <button id="start" type="button">Start QR Scanner</button>
  <button id="stop" type="button" disabled>Stop Scanner</button>

  <div id="reader"></div>

  <h3>Scanned QR content</h3>
  <pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');

    let scanner = null;
    let starting = false;
    let lastText = '';

    startBtn.addEventListener('click', async function () {
      if (starting || scanner) return;

      starting = true;
      startBtn.disabled = true;
      statusEl.textContent = 'Requesting camera permission...';

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          function (decodedText) {
            if (decodedText === lastText) return;
            lastText = decodedText;
            resultEl.textContent = decodedText;
            statusEl.textContent = 'QR code read successfully.';
          },
          function () {
            // Ignore frames where no QR code is detected.
          }
        );

        stopBtn.disabled = false;
        statusEl.textContent = 'Camera running. Point it at a QR code.';
      } catch (error) {
        statusEl.textContent = 'Could not start scanner: ' +
          (error.message || String(error));

        if (scanner) {
          try { await scanner.clear(); } catch (_) {}
          scanner = null;
        }

        startBtn.disabled = false;
      } finally {
        starting = false;
      }
    });

    stopBtn.addEventListener('click', async function () {
      if (!scanner) return;

      stopBtn.disabled = true;
      try {
        await scanner.stop();
        await scanner.clear();
        scanner = null;
        startBtn.disabled = false;
        statusEl.textContent = 'Scanner stopped.';
      } catch (error) {
        statusEl.textContent = 'Could not stop scanner: ' +
          (error.message || String(error));
      }
    });
  </script>
</body>
</html>
